<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost frame — John Solomon</title>
<meta name="theme-color" content="#09080d">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  body{display:grid;place-items:center;min-height:100svh;text-align:center;cursor:auto}
  a,button{cursor:pointer}
  .lost{position:relative;z-index:2;padding:0 var(--pad)}
  .lost__code{font-family:var(--display);font-weight:700;font-size:clamp(120px,24vw,300px);letter-spacing:-.07em;line-height:.85;margin:0;background:var(--grad);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:drift 5s ease-in-out infinite alternate}
  .lost h1{font-family:var(--display);font-weight:500;font-size:clamp(24px,3.4vw,44px);letter-spacing:-.03em;margin:18px 0 34px}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i class="aurora__a"></i><i class="aurora__b"></i><i class="aurora__c"></i></div>
<div class="grain" aria-hidden="true"></div>
<main class="lost">
  <p class="lost__code">404</p>
  <h1>This frame was <em>never generated.</em></h1>
  <a class="btn btn--grad" href="/">Back to the reel →</a>
</main>
</body>
</html>
